short_bio: >-
  <p>
    I am Songwei Dong (董松玮), a third-year Ph.D. student at the University of Virginia, where I am
    fortunate to be advised by Professor <a href="https://cshen317.github.io/" target="_blank">Cong Shen</a>.
    Previously, I received my B.S. degree in Artificial Intelligence in 2024 from the University of Science
    and Technology of China.
  </p>
  <p>
    My research is on augmenting large language models with external knowledge, tools, and memory, spanning
    LLM agents (multi-agent systems and agent memory) and retrieval-augmented generation (RAG). I also work
    on vision-language models (VLMs), with broader interests in multimodal learning, coreset selection, and
    LLM efficiency.
  </p>

